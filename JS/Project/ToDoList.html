<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body class="d-flex justify-content-center" >
    <div class="card text-center" id="box" style="width: 40rem; height:50rem">
        <div class="card-header text-bg-primary">
            To-Do List
        </div>
        <div class="abcd">
            <h5 class="card-title">Enter Any Task You Want Here</h5>
            <input type="text" name="" id="inputData">
            <button id="btn" class="btn btn-primary" onclick="addTask()">Add</button>
        </div>
        <div class="card-body" id="disp">

        </div>
        <div class="card-footer text-body-secondary">
            Made with Love and Excitement By Mihir.
        </div>
    </div>
</body>
<script >
    let box = document.getElementById("box");
    let btn = document.getElementById("btn");
    let inputData = document.getElementById("inputData");
    let disp = document.getElementById("disp");
    let store = [];
    
    function addTask() {
        let toDO = inputData.value
        store.push(toDO);
        displayToDo()
    }
        
    function displayToDo(){
        disp.innerHTML =""
        store.forEach((Element, i ) => {
            disp.innerHTML += `
                            <div class="row d-flex justify-content-between">
                                <div class="col-7 d-flex align-items-center">
                                    ${Element}   
                                </div>
                                <div class="col-2 m-1">
                                    <button  class="btn btn-success" onclick="updateTask(${i})">Update</button>
                                </div>
                                <div class="col-2 m-1">
                                    <button  class="btn btn-danger" onclick="deleteTask(${i})">Delete</button>
                                </div>
                            </div>

            `
        });
    }

</script>

</html>
