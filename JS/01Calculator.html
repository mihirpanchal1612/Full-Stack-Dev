<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    
</head>
<body class="d-flex justify-content-center M3">
    <div class="card" style="width: 18rem;">
        <div class="card-header text-bg-primary ">
            <h2>Calculator</h2>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item text-bg-warning">
                <input type="text" name="" placeholder="Enter a Number1" id="num1">
            </li>
            <li class="list-group-item text-bg-warning">
                <input type="text" name="" placeholder="Enter a Number2" id="num2">
            </li>
            <li class="list-group-item text-bg-dark">
            
                <button type="button" class="text-bg-success" onclick="addNumber()">+</button>
                <button type="button" class="text-bg-success" onclick="minusNumber()">-</button>
                <button type="button" class="text-bg-success" onclick="multiNumber()">*</button>
                <button type="button" class="text-bg-success" onclick="divNumber()">/</button>

            </li>
        </ul>
    <div class="card-footer text-bg-danger">
         <h3 id="res"></h3>
    </div>
</div>  

    
   
    
   

    <script>
        let res = document.getElementById("res");
        function addNumber() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);


            res.innerText = num1+num2;
        }
        function minusNumber() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);

            res.innerText = num1-num2;
        }
        function multiNumber() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);

            res.innerText = num1*num2;
        }
        function divNumber() {
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);

            res.innerText = (num1/num2).toFixed(2);
        }
    </script>
