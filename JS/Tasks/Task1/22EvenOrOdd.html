<body>
    <h1>Task-22 : Even Or Odd</h1>

    <script>
        const Num = 111;

        if (Num % 2==0 ) {
            console.log("The Number is Even");
        } else if (Num % 2== 1){
            console.log("The Number is Odd");
        } else if (Num === 0){
            console.log("The Number is 0");
        } else{
            console.log("Enter a Number");
        }
    </script>
</body>
