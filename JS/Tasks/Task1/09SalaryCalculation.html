<body>
    <h1>Task-9 : Salary Calculation</h1>
    <img src="./Screenshots/task9.png" alt="">

    <script>
        const BasicSalary = 30000;

        const HRA = (BasicSalary*20/100);
        console.log("The HRA is : "+ HRA);
        const DA = (BasicSalary*10/100);
        console.log("The DA is : " + DA );
        const TotalSalary = BasicSalary + HRA + DA;
        console.log("Total salary of EMployee is : ₹" +TotalSalary );
        
        
    </script>
