<body>
    <script>
         function PrintNumbers(n) {
            let sum = 0;
            for (let m = 1; m < n+1 ; m++) {
                if (m%2==0) {
                    sum+=m;
                }
            }   
            console.log(sum);
            
        }
        PrintNumbers(10);
        </script>
