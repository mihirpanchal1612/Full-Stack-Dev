<script>


function calculateGrade(num) {
    
    switch(true){
        case(num >=90):
        console.log("Your Grade is A");
        break;
        
        case(num >=75):
        console.log("Your Grade is B");
        break;
        
        case(num >=60):
        console.log("Your Grade is C");
        break;

        case(num >=35):
        console.log("Your Grade is D");
        break;
                
        case(num < 35):
        console.log("Your Grade is F");
        break;    
        }
    }

    calculateGrade(99);
</script>
