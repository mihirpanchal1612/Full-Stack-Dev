<!DOCTYPE html>
<html lang="en">

<body>
    <h1>Task-24 : Grade Calculator</h1>
    <script>
        const studentPercentage = 72;

        switch(true){
            case(studentPercentage >=90):
                console.log("Your Grade is A");
                break;

            case(studentPercentage >=75):
                console.log("Your Grade is B");
                break;

            case(studentPercentage >=60):
                console.log("Your Grade is C");
                break;

            case(studentPercentage >=35):
                console.log("Your Grade is D");
                break;

            case(studentPercentage < 35):
                console.log("Your Grade is F");
                break;    
        }
    </script>
</body>
</html>
