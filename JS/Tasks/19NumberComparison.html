<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Task-19 : Number Comparison</h1>
    <script>
        const FirstNum = 50;
        const SecondNum = 50;

        switch (true) {
            case (FirstNum < SecondNum):
                console.log("First Number is Smaller than Second Number");
                break;
            case (FirstNum > SecondNum):
                console.log("First Number is Bigger than Second Number");
                break;
            default:
                console.log("Both Numbers are Equal");
                break;
        }
    </script>
</body>
</html>
