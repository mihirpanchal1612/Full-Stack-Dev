<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 250px;
            width: 250px;
            border: 1px solid black;
            cursor: grab;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div id="box" onclick="colorChange()" ondblclick="sizeChange()" >
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat eos alias doloribus non exercitationem assumenda facilis rem ipsam quasi veniam aliquid, cupiditate iure aliquam dolorum pariatur sapiente asperiores facere voluptas.
    </div>

<script>
    let box = document.getElementById("box")
    function colorChange() {
        if (box.style.background="none") {
        box.style.background="red";    
        } 
    }

    function sizeChange() {
        box.style.width="500px";
        box.style.height="500px";
    }


</script>
</body>
</html>
