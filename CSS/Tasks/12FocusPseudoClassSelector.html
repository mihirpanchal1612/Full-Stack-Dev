<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Pseudo Class Selector </title>
    <style>
        label{
            font-size: 28px;
        }
        input{
            color: yellow;
            background-color: cadetblue;
            border: 5px solid black;
            height: 75px;
            width: 250px;
            font-size: 24px;
        }
        /* Focus Pseudo Class Selector */
        input:focus{
            color: lightgreen;
            background-color: black;
            border: 5px dotted white;
        }
    </style>
</head>
<body>
    <h1>Focus Pseudo Class Selector</h1>
    <label>Name : </label>
    <input type="text">
    <br>
    <label >Password : </label>
    <input type="password">
</body>
</html>
