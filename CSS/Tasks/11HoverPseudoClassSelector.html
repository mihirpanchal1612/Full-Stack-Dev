<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Pseudo Class Selector</title>
    <style>
        h1{
            font-size: 40px;
        }
        button{
            background-color: cornflowerblue;
            color: yellow;
            height: 100px;
            width: 200px;
            font-size: 32px;
        }
        /* Hover Pseudo Class */
        button:hover{
            background-color: violet;
            color: cornsilk;
        }

    </style>
</head>
<body>
    <h1>Hover Pseudo Class Selector</h1>
    <Button>Click Me</Button>
    <button>Log In</button>
    <button>Sign Up</button>
</body>
</html>
