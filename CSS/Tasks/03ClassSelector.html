<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Selector</title>
    <style>
        /* Class Selector CSS */
        body{
            background-color: rgb(0, 64, 255);
        }

        .card{
            width: 200px;
            height: 200px;
            background-color: chartreuse;
            border: 5px solid black;
            margin: auto;
            padding: 5px;
        }
        .box{
            height: 200px;
            width: 200px;
            background-color: rgb(255, 255, 0);
            border: 5px solid red;
            margin: auto;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="box"></div>
</body>
</html>
