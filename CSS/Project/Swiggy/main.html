<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="home">
        <div class="nav">
            <nav>
                <img src="./images/swiggy_logo_white.avif" alt="swiggy logo" height="48px" width="160px">
                <div class="navbar">
                    <ul class="nava">
                        <li><a href="">Swiggy Corporate</a></li>
                        <li><a href="">Partner with Us</a></li>
                        <li><button class="getapp">Get the App</button></li>
                        <li><button class="signin">Sign in</button></li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="home_content">
            <div class="tagline">
                <p>Order food & Groceries. Discover Best restaurants. Swiggy it.</p>
            </div>
            <div>
                <input type="text" placeholder="Enter your Delivery Location">
                <input type="text" placeholder="Search for restaurants, Item or more">
            </div>
        </div>
        <div class="container">
            <div class="row g-10">
                <div class="col-33">
                    <div class="card">
                        <img src="./images/card1.avif" alt=""  class="card1">    
                    </div>
                    </div>
                    <div class="col-33">
                        <div class="card">
                            <img src="./images/card2.avif" alt=""  class="card1">
                        </div>
                    </div>
                    <div class="col-33">
                        <div class="card">
                            <img src="./images/card3.avif" alt="" class="card1" >
                    </div>
                </div>          
            </div>
        </div>
        <!-- <img src="./images/Veggies_new.avif" alt="" height="450px"> -->
        <!-- <img src="./images/Sushi_replace.avif" alt="" height="450px"> -->
    </div>
