<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Selector</title>
    <style>
        body{
            background-color: black;
        }
        /* Attribute Selector */
        input[type="text"]{
            border: 10px solid white;
            background-color:cornflowerblue;
            font-size: 32px;
            color: yellow;
            height: 100px;
            margin: 10px auto;
            padding: 20px;
        }
        input[type="password"]{
            border: 10px solid white;
            background-color: violet;
            font-size: 32px;
            color: bisque;
            height: 100px;
            margin: 10px auto;
            padding: 20px;
        }
        input[type="email"]{
            border: 10px solid white;
            background-color: cadetblue;
            font-size: 32px;
            color:lemonchiffon;
            margin: 10px auto;
            padding: 20px;
        }
        input[type="number"]{
            height: 100px;
            width: 200px;
        }
    </style>
</head>
<body>
    <input type="text">
    <br>
    <input type="password">
    <br>
    <input type="email">
    <br>
    <input type="number">
</body>
</html>
