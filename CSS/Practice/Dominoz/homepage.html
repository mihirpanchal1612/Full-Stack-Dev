<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino's Pizza - Order online pizza at your doorstep.</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="./images/Logo.png" alt="Domino's Pizzas Logo">
            </div>            
            <div class="navbar">
                <a class="navanchor" href="">Our Menu</a>
                <a class="navanchor" href="">Domino's Stores</a>
                <a class="navanchor" href="">Gift card</a>
                <a class="navanchor" href="">Corporate Enquiry</a>
                <a class="navanchor" href="">Contact</a>
                <button>Download App</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="content">
            <div class="contenttext">
                <h1>Domino's online Ordering</h1>
                <p>Yummy Pizza Delivered fast & fresh</p>
                <button class="order">Order Online Now</button>
            </div>
            <div class="contentImage">
                <img src="./images/home_body_background.png" alt="">
            </div>
        </div>
        <div class="cardcontainer">
            <div class="h2">
                <h2>Explore</h2>
            </div>
            <div class="cards">
                <div class="card">
                    
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
