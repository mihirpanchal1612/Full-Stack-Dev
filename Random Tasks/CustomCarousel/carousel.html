<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="prev">
        <button  onclick="prevSlide()">
            <i class="fa-solid fa-arrow-left-long" style="color:red;"></i>
        </button>
    </div>
    <div class="next">
        <button  onclick="nextSlide()">
            <i class="fa-solid fa-arrow-right-long"  style="color:red;"></i>
        </button>
    </div>

    <div class="slider">
        <div class="slides">        
            <img class="slide" src="./akaza-unbreakable-spirit-uc-1920x1080.jpg">
        </div>
        <div class="slides">
            <img class="slide" src="./akira-dreamer-4k-5h-1920x1080.jpg">
        </div>
        <div class="slides">
            <img class="slide" src="./the-spiky-rainbow-orb-tunnel-0o-1920x1080.jpg">
        </div>
    </div>

<script>
    const slides = document.querySelectorAll(".slides img");
    let slideIndex = 0;
    
    function showSlide(index) {
        if (index >= slides.length) {
            slideIndex = 0;
        } else if (index < 0){
            slideIndex = slides.length-1;
        }

        slides.forEach(slide => {
            slide.classList.remove("displaySlide");
        });

        slides[slideIndex].classList.add("displaySlide");
    }

    function prevSlide() {
        slideIndex--;
        showSlide(slideIndex);
    }
    
    function nextSlide() {
        slideIndex--;
        showSlide(slideIndex);
    }
</script>
</body>
</html>
