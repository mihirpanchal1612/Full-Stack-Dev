      <div class="container text-center mt-4 d-flex flex-wrap" id="i">
        <div class="width50">
            <img id="productImage" style="max-height: 300px; max-width: 100%;">
        </div>
        <hr>
        <div class="width50">
            <h1 id="producttitle"></h1>
            <h4 id="productdescription" class="flex-wrap"></h4>
            <h2 id="productprice"></h2>
            <button class="btn btn-danger" onclick="addToCart()">
                Add to Cart
            </button>
        </div>
    </div>       
</body>
<script>
    
        let savedImage = localStorage.getItem("image");
        let savedtitle = localStorage.getItem("title");
        let saveddescription = localStorage.getItem("description");
        let savedprice = localStorage.getItem("price");

        document.getElementById("productImage").src = savedImage;
        document.getElementById("producttitle").innerHTML = savedtitle;
        document.getElementById("productdescription").innerHTML = saveddescription;
        document.getElementById("productprice").innerHTML = savedprice;

// Creating a cart array 

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push({
                image: savedImage,
                title: savedtitle,
                price: savedprice,
                description: saveddescription,
            });
            localStorage.setItem("cart", JSON.stringify(cart));
        }

</script>
