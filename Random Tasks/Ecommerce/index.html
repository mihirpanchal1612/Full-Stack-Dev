<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prettier - Buy Cosmetic products online easily</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style>
        @font-face{
            src: url(./Tungsten-Bold.ttf);
            font-family: Tungsten;
        }

        .main{
            display: flex;
        }
        .width80{
            width: 80%;
            margin: 0 auto;
        }
        .imgsize{
            height: 300px;
            width: 250px;  
        }
        .bg-custom{
            background-color: #c02806 ;
            font-family: tungsten;
            font-size: 42px;
            color: white;
        }

    </style>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-custom text-center">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" target=""><img src="./Images/BackYard.png" alt="" height="200px" ></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item ">
                    <a class="nav-link bg-custom " aria-current="page" href="index.html">Home</a>
                </li>
                <li class="nav-item ">
                    <a class="nav-link bg-custom" href="productPage.html">Products</a>
                </li>
                <li class="nav-item bg-custom">
                    <a class="nav-link bg-custom" href="cart.html">Your Cart</a>
                </li> 
            </ul>
        </div>
    </div>
</nav>

<div class="main">    
   
    <div class="width80">
        <div class="display d-flex justify-content-around row row-cols-8 gy-4 mt-4" id="display">
            
        </div>
    </div>
     
</div>

</body>
<script>
    const display = document.getElementById("display");

    fetch('https://fakestoreapi.com/products/')
        .then(response => response.json())
        .then(products => {
            products.forEach(product => {
                display.innerHTML += `
                <div class="card" style="width: 22rem;">
                    <img src="${product.image}" class="card-img-top" alt="${product.title}">
                    <div class="card-body">
                        <h4 class="card-title">${product.title.slice(0,15)}</h4>
                        <p class="card-text">${product.description.slice(0,20)}</p>
                        <p class="card-text">${product.price}</p>
                        <a href="productPage.html" onclick="set('${product.image}');
                         settitle('${product.title}')
                        ; setdescription('${product.description}')
                        ; setprice('${product.price}')"
                        target="_blank"
                         class="btn btn-danger">View Product</a>
                    </div>
                </div>`;
            });
        });
        
        
// Setting up a Local Storage

    function set(image) {
        localStorage.setItem('image', image);
    }
    function settitle(title){
        localStorage.setItem('title', title);
    }
    function setdescription(description){
        localStorage.setItem('description', description);
    }
     function setprice(price){
        localStorage.setItem('price', price);
    }

</script>
</html>
