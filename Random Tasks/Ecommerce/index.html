<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prettier - Buy Cosmetic products online easily</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .main{
            display: flex;
        }
        .width10{
            width: 10%;
        }
        .width80{
            width: 80%;
        }
    </style>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary text-center">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Prettier</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Your Cart</a>
                </li> 
            </ul>
        </div>
    </div>
</nav>


<div class="main">    
    <div class="width10">
        
    </div>
    <div class="width80">
        <div class="display d-flex justify-content-around row row-cols-6" id="display">
            
        </div>
    </div>
    <div class="width10">
        
    </div>
</div>
</body>
<script>
    const display = document.getElementById("display")

    let list = fetch('https://fakestoreapi.com/products/')
        .then(response =>(
            response.json()
        ))
        .then(data => {
            console.log(data)
            console.log("This is working"); 

        data.forEach(data => {
            display.innerHTML += `
            <a class="card" href="" target="_blank" style="width: 22rem;">
                <img src="${data.image}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">${data.title.slice(0,15)}</h5>
                    <p class="card-text">${data.description.slice(0,20)}</p>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">$ ${data.price}</li>
                    </ul>    
                </a>
                `  
        }); })   
               
</script>
</html>
