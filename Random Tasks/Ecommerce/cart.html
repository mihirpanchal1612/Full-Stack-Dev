<body>
    <nav class="navbar navbar-expand-lg bg-custom text-center">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" target=""><img src="./Images/BackYard.png" alt="" height="200px" ></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

    <div style="position: relative; bottom: 0px; left: 160px;top: 25px;">
        <img src="" >
    </div>

    <div class="container mt-4">

        <h1  class="d-flex" style="margin-top: 60px;">My Cart</h1>

        <!-- Cart products -->
        <div id="cartItems" class="d-flex flex-wrap gap-3"></div>

        <!-- Bill section -->
        <div id="placeorder"></div>

    </div>

</body>
<script>
    
    
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let cartItems = document.getElementById("cartItems");
        let placeorder = document.getElementById("placeorder");
        let payment = document.getElementById("payment");

        let totalamount = 0;

        function showCart() {
            cartItems.innerHTML = "";

            if (cart.length == 0) {
                cartItems.innerHTML = `
                    <div id="empty">
                        <p>Your Cart is Empty</p>
                        <br>
                        <a href="./wishlist.html" class="btn btn-success mt-3">
                            Add Items from Wishlist
                        </a>
                    </div>
                `;
                return;
            }

            cart.forEach(function(product, i) {
                cartItems.innerHTML += `
                    <div class="card p-3" style="width: 50rem;">
                        <img src="${product.image}"
                             style="height: 180px; object-fit: contain;">

                        <h5 class="mt-3">${product.title}</h5>

                        <p>${product.description || ""}</p>

                        <h6>Price: $${product.price}</h6>

                        <button class="btn btn-danger"
                                onclick="del(${i})">
                            Delete
                        </button>
                    </div>
                `;
            });
        }

        function del(i) {
            cart.splice(i, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            showCart();
            checkCart();
        }

        function checkCart() {
            if (cart.length > 0) {
                let total = 0;

                cart.forEach(function(product) {
                    total = total + Number(product.price);
                });

                let platformfee = 10;
                let discount = total * 10 / 100;

                totalamount = total + platformfee - discount;

                placeorder.innerHTML = `
                    <div class="bill">
                        <h4>Total MRP: $${total.toFixed(2)}</h4>
                        <h4>Discount: -$${discount.toFixed(2)}</h4>
                        <h4>Platform Fee: $${platformfee.toFixed(2)}</h4>
                        <hr>
                        <h3>Total Amount: $${totalamount.toFixed(2)}</h3>

                        <button class="btn btn-success mt-3"
                                onclick="pay()">
                            Place Order
                        </button>
                    </div>
                `;
            } else {
                placeorder.innerHTML = "";
            }
        }

</script>
</html>
